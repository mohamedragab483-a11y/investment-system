<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إدارة المشاريع الاستثمارية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900">نظام إدارة المشاريع</h1>
            <p class="text-sm text-slate-500 mt-1">سجل الدخول للوصول إلى لوحة المتابعة المالية</p>
        </div>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm mb-6 text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">اسم المستخدم</label>
                <input type="text" name="username" required placeholder="admin" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1.5">كلمة المرور</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition duration-200">
                تسجيل الدخول
            </button>
        </form>
        <div class="mt-6 text-center text-xs text-slate-400">
            الحساب الافتراضي للنظام: <span class="font-mono text-slate-600">admin / admin123</span>
        </div>
    </div>
</body>
</html>
